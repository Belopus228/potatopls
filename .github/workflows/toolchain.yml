# ВРЕМЕННО (для разработки): кладёт официальную сборку Godot и web-шаблоны экспорта
# в служебную ссылку refs/toolchain/godot этого репозитория. Среда, в которой пишется
# игра, не может скачивать файлы из GitHub Releases напрямую, а git-ссылки — может.
# Контрольные суммы сверяются с официальным SHA512-SUMS.txt.
name: toolchain (временно)

on:
  push:
    branches: ['arena/c09c2baf-potatopls']
    paths: ['.github/workflows/toolchain.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Скачать Godot и шаблоны, положить в refs/toolchain/godot
        env:
          V: 4.4.1-stable
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/$V
          curl -fsSL --retry 3 -o "Godot_v${V}_linux.x86_64.zip" "$base/Godot_v${V}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "Godot_v${V}_export_templates.tpz" "$base/Godot_v${V}_export_templates.tpz"
          curl -fsSL --retry 3 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          sha512sum -c --ignore-missing SHA512-SUMS.txt
          unzip -l "Godot_v${V}_export_templates.tpz" | awk '{print $1, $4}' | tr '\n' ';' > list.txt
          echo "::notice title=templates::$(cat list.txt | cut -c1-3000)"
          mkdir relay
          unzip -q -j "Godot_v${V}_export_templates.tpz" 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' 'templates/version.txt' -d relay
          cp "Godot_v${V}_linux.x86_64.zip" SHA512-SUMS.txt relay/
          cd relay
          sha256sum * > SHA256.txt
          ls -l
          git init -q
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Godot $V: редактор (linux x86_64) и web-шаблоны"
          git push --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:refs/toolchain/godot
          echo "::notice title=toolchain::$(git rev-parse HEAD) $(du -sh . | cut -f1)"

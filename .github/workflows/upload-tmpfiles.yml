# Выкладывает архив с игрой на https://tmpfiles.org/ и печатает ссылку
# (в заметках запуска и в Summary). Ссылки tmpfiles.org живут 60 минут —
# чтобы получить свежую, перезапусти задачу (Actions → Re-run jobs).
name: Архив на tmpfiles.org

on:
  push:
    branches: ['arena/c09c2baf-potatopls']
    paths: ['docs/mellstroynost-3d.zip', '.github/workflows/upload-tmpfiles.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Выложить docs/mellstroynost-3d.zip
        run: |
          set -euo pipefail
          f=docs/mellstroynost-3d.zip
          ls -l "$f"
          sum=$(sha256sum "$f" | cut -d' ' -f1)
          resp=$(curl -fsS --retry 3 --retry-delay 5 -F "file=@$f" https://tmpfiles.org/api/v1/upload)
          echo "$resp"
          url=$(printf '%s' "$resp" | python3 -c 'import sys, json; print(json.load(sys.stdin)["data"]["url"])')
          url=$(printf '%s' "$url" | sed 's#^http://#https://#')
          dl=$(printf '%s' "$url" | sed 's#tmpfiles.org/#tmpfiles.org/dl/#')
          # проверка: скачиваем обратно и сверяем контрольную сумму
          back=$(curl -fsSL --retry 3 "$dl" | sha256sum | cut -d' ' -f1) || back=fail
          if [ "$back" = "$sum" ]; then check="файл скачивается, sha256 совпадает"; else check="ВНИМАНИЕ: скачанный файл не совпал с исходным"; fi
          echo "::notice title=tmpfiles.org::$url"
          echo "::notice title=tmpfiles.org — прямая ссылка::$dl"
          echo "::notice title=Проверка::$check ($sum)"
          {
            echo "### Архив на tmpfiles.org"
            echo
            echo "- страница: $url"
            echo "- прямая ссылка: $dl"
            echo "- проверка: $check"
            echo
            echo "Ссылка живёт 60 минут. Нужна новая — Re-run jobs."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$back" = "$sum" ]
